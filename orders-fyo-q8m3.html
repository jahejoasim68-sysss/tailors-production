<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FYO Production Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#1f1b16;--mute:#7a7268;--line:#e7e1d8;--gold:#9a7b4f;--red:#b4232c;--redbg:#fbe9ea;--amb:#a86a00;--ambbg:#fff3dc;--grn:#2f7a4b;--grnbg:#e5f3ea;
--s-new:#8a8178;--s-emb:#7b3fa0;--s-sti:#1f5fa8;--s-rdy:#a86a00;--s-dis:#2f7a4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}
h1{font:600 28px/1.1 "Cormorant Garamond",serif;margin:0;letter-spacing:.3px}
.sub{color:var(--mute);font-size:12.5px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.stat.on{outline:2px solid var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;background:#ebe5dc;border-radius:999px;padding:3px}
.tab{border:0;background:none;padding:7px 16px;border-radius:999px;font:600 13px Inter;cursor:pointer;color:var(--mute)}
.tab.on{background:var(--ink);color:#fff}
input[type=search]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:14px Inter;background:#fff}
main{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
.group{margin:18px 0 8px;font:600 12px Inter;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;gap:8px;align-items:center}
.group i{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.late{border-color:#e9b3b6}
.top{display:flex;gap:12px;padding:12px}
.pics{display:flex;flex-direction:column;gap:6px;flex:none}
.pics img{width:76px;border-radius:8px;display:block;background:#eee;object-fit:cover}
.meta{flex:1;min-width:0}
.row1{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.on2{font:600 18px "Cormorant Garamond",serif}
.cust{font-weight:600}
.due{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;background:#f0ece5;color:var(--ink)}
.due.late{background:var(--redbg);color:var(--red)}
.due.soon{background:var(--ambbg);color:var(--amb)}
.items{margin:6px 0 0;padding:0;list-style:none}
.items li{margin:3px 0}
.sz{display:inline-block;font-size:11.5px;font-weight:600;border:1px solid var(--ink);border-radius:4px;padding:0 5px;margin-left:4px}
.cz{font-size:12.5px;color:#4a3f33;background:#faf6ef;border-left:3px solid var(--gold);padding:4px 7px;margin:4px 0 0;border-radius:0 6px 6px 0}
.small{font-size:12px;color:var(--mute);margin-top:6px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;margin-right:4px}
.p-paid{background:var(--grnbg);color:var(--grn)}
.p-pend{background:var(--ambbg);color:var(--amb)}
.flag{font-size:12px;background:var(--redbg);color:var(--red);padding:5px 9px;margin:0 12px 8px;border-radius:8px;font-weight:500}
details{margin:0 12px 10px;font-size:12.5px}
summary{cursor:pointer;color:var(--gold);font-weight:600}
pre{white-space:pre-wrap;font:12.5px/1.5 Inter;margin:6px 0 0;background:#faf8f4;border-radius:8px;padding:8px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:auto}
.st{border:0;border-right:1px solid var(--line);background:#fff;padding:10px 4px;font:600 11.5px Inter;cursor:pointer;color:var(--mute)}
.st:last-child{border-right:0}
.st:disabled{cursor:default;opacity:.55}
.st.on.emb{background:var(--s-emb);color:#fff}.st.on.sti{background:var(--s-sti);color:#fff}.st.on.rdy{background:var(--s-rdy);color:#fff}.st.on.dis{background:var(--s-dis);color:#fff}
.upd{font-size:11px;color:var(--mute);padding:5px 12px;border-top:1px dashed var(--line)}
.stagetag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff}
.note{max-width:1100px;margin:0 auto;padding:0 16px;font-size:12.5px;color:var(--mute)}
.banner{background:var(--ambbg);color:var(--amb);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:12.5px}
.empty{color:var(--mute);padding:30px;text-align:center}
@media(max-width:560px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.pics img{width:64px}}
.tn{max-width:1100px;margin:0 auto;padding:0 16px}
.tnbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.tnbox h2{font:600 18px "Cormorant Garamond",serif;margin:0 0 8px}
.tnrow{display:flex;gap:8px}
.tnrow textarea,.onote textarea{flex:1;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px Inter;resize:vertical;min-height:38px}
.btn{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;font:600 12.5px Inter;cursor:pointer}
.btn:disabled{opacity:.5}
.tnl{list-style:none;margin:10px 0 0;padding:0;max-height:220px;overflow:auto}
.tnl li{border-top:1px solid var(--line);padding:7px 0;font-size:13px;display:flex;gap:8px;justify-content:space-between}
.tnl small{color:var(--mute);font-size:11px;white-space:nowrap}
.tnl .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px}
.onote{margin:0 12px 10px}
.onote .cur{font-size:12.5px;background:#eef4fb;border-left:3px solid var(--s-sti);padding:5px 8px;border-radius:0 6px 6px 0;margin-bottom:6px;white-space:pre-wrap}
.onote .cur small{display:block;color:var(--mute);font-size:11px}
.onote .tnrow textarea{min-height:34px}
</style>
</head>
<body>
<header>
  <h1>Fehmida Yousuf — Production Tracker</h1>
  <div class="sub">Orders pulled from Shopify on 15 Nov 2026 · Tap a stage on any order to update it for everyone</div>
  <div style="margin-top:10px"><input id="myname" placeholder="Aap ka naam (e.g. Usama)" style="border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:14px Inter;width:220px"></div>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
</header>
<div class="bar"><div class="bar-in">
  <div class="tabs"><button class="tab on" data-v="pending">Pending</button><button class="tab" data-v="dispatched">Dispatched</button></div>
  <input type="search" id="q" placeholder="Search order #, customer, article…">
</div></div>
<div class="tn"><div class="tnbox"><h2>Team notes</h2>
<div class="tnrow"><textarea id="tnin" placeholder="Note for the whole team (fabric arrived, tailor off today, courier pickup time…)"></textarea><button class="btn" id="tnadd">Add</button></div>
<ul class="tnl" id="tnl"><li><small>No notes yet.</small></li></ul></div></div>
<main id="list"></main>

63", "due": "2026-12-05", "c": "Bawan Sandhu", "ship": "Surrey, Canada", "pay": "Paid", "sf": "Unfulfilled", "t": 48500, "items": [["Mehreen", "S", 1, "mehreen", ""]], "note": "5 Dec"}, {"n": "2781", "due": "2026-12-10", "c": "Nahida Ahmadi", "ship": "El Cajon, USA", "pay": "Paid", "sf": "Unfulfilled", "t": 104500, "items": [["RANIA", "XS", 1, "rania", "Needed by December 10th"]], "note": "10 December"}, {"n": "2793", "due": "2026-12-20", "c": "Aliza Khwaja", "ship": "New Hyde Park, USA", "pay": "Paid", "sf": "Unfulfilled", "t": 70000, "items": [["ZORA", "XS", 1, "zora", ""]], "note": "20 Dec"}, {"n": "2796", "due": "2026-12-20", "c": "Aiman Alam", "ship": "Huddersfield, UK", "pay": "Paid", "sf": "Unfulfilled", "t": 52700, "items": [["EIRA", "S", 1, "eira", "Modest neckline if possible"]], "note": "20 Dec"}, {"n": "2774", "due": "2027-01-15", "c": "Subia Majid", "ship": "Attock Hazro, PK", "pay": "Pending", "sf": "Unfulfilled", "t": 230300, "items": [["MEHRUNISA", "Custom", 4, "mehrunisaB", ""]], "note": "Delivery 15 January\nPaid PKR 115,150\nCustom measurements & colour - refer to group"}, {"n": "2797", "due": "2027-01-15", "c": "Laiba Intisar", "ship": "Mandi Bahauddin, PK", "pay": "Paid", "sf": "Unfulfilled", "t": 92300, "items": [["Elara", "Custom", 1, "elara", "Shoulders 14.5, chest 36, choli 17 (modest), upper waist 29, lehenga 47 (straps attached, belt given)"]], "note": "Delivery 15 January\nColour customised to pink of NOORÈ lehenga (reference picture on WhatsApp)"}];
const STAGES=[["new","Not started"],["emb","Embroidery"],["sti","Stitching"],["rdy","Ready"],["dis","Dispatched"]];
const SNAME=Object.fromEntries(STAGES);
const SCOLOR={new:"var(--s-new)",emb:"var(--s-emb)",sti:"var(--s-sti)",rdy:"var(--s-rdy)",dis:"var(--s-dis)"};
const TODAY=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())})();
let notes={}, tnotes=[];
let state={}; // n -> {stage,by,at}
let view="pending", filt=null, q="", db=null, user=null, canWrite=true, names={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stageOf=o=>(state[o.n]&&state[o.n].stage)||(o.sf==="Fulfilled"?"dis":"new");
const dd=o=>{const [y,m,d]=o.due.split("-").map(Number);return Math.round((new Date(y,m-1,d)-TODAY)/864e5)};
const fmtDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{day:"numeric",month:"short"})};
function dueTag(o){const n=dd(o);if(stageOf(o)==="dis")return `<span class="due">${fmtDate(o.due)}</span>`;
 if(n<0)return `<span class="due late">${fmtDate(o.due)} · ${-n}d late</span>`;
 if(n===0)return `<span class="due late">Due today</span>`;
 if(n<=3)return `<span class="due soon">${fmtDate(o.due)} · ${n}d</span>`;
 return `<span class="due">${fmtDate(o.due)}</span>`}
function card(o){
 const s=stageOf(o), late=dd(o)<0&&s!=="dis";
 const pics=[...new Set(o.items.map(i=>i[3]))].map(k=>`<img src="data:image/jpeg;base64,${IMG[k]}" alt="">`).join("");
 const items=o.items.map(i=>`<li><b>${esc(i[0])}</b><span class="sz">${esc(i[1])}</span>${i[2]>1?` ×${i[2]}`:""}${i[4]?`<div class="cz">${esc(i[4])}</div>`:""}</li>`).join("");
 const st=state[o.n];
 const upd=st&&st.at?`<div class="upd">${esc(SNAME[st.stage])} · ${new Date(st.at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}${st.by?` · by ${esc(st.by)}`:""}</div>`:"";
 const btns=STAGES.slice(1).map(([k,l])=>`<button class="st ${k}${s===k?" on":""}" data-n="${o.n}" data-s="${k}" ${canWrite?"":"disabled"}>${l}</button>`).join("");
 return `<div class="card${late?" late":""}">
  <div class="top"><div class="pics">${pics}</div><div class="meta">
   <div class="row1"><div><div class="on2">#${o.n}</div><div class="cust">${esc(o.c)}</div></div>${dueTag(o)}</div>
   <ul class="items">${items}</ul>
   <div class="small"><span class="pill ${o.pay==="Paid"?"p-paid":"p-pend"}">${o.pay==="Paid"?"Paid":"Payment pending"}</span><span class="stagetag" style="background:${SCOLOR[s]}">${SNAME[s]}</span><br>${esc(o.ship)} · PKR ${o.t.toLocaleString()}</div>
  </div></div>
  ${o.flag?`<div class="flag">⚠ ${esc(o.flag)}</div>`:""}
  <details><summary>Measurements & notes</summary><pre>${esc(o.note)}</pre></details>
  <div class="onote">${notes[o.n]&&notes[o.n].text?`<div class="cur">${esc(notes[o.n].text)}<small>${new Date(notes[o.n].at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}${notes[o.n].by?` · ${esc(notes[o.n].by)}`:""}</small></div>`:""}<div class="tnrow"><textarea data-on="${o.n}" placeholder="Production note for #${o.n}…" ${canWrite?"":"disabled"}></textarea><button class="btn onsave" data-n="${o.n}" ${canWrite?"":"disabled"}>Save</button></div></div>
  ${upd}
  <div class="stages">${btns}</div></div>`}
function render(){
 const counts={new:0,emb:0,sti:0,rdy:0,dis:0};ORDERS.forEach(o=>counts[stageOf(o)]++);
 const late=ORDERS.filter(o=>stageOf(o)!=="dis"&&dd(o)<0).length;
 document.getElementById("stats").innerHTML=STAGES.map(([k,l])=>`<div class="stat${filt===k?" on":""}" data-f="${k}"><b style="color:${SCOLOR[k]}">${counts[k]}</b><span>${l}</span></div>`).join("");
 let list=ORDERS.filter(o=>view==="dispatched"?stageOf(o)==="dis":stageOf(o)!=="dis");
 if(filt&&filt!=="dis"&&view==="pending")list=list.filter(o=>stageOf(o)===filt);
 if(q){const t=q.toLowerCase();list=list.filter(o=>(o.n+" "+o.c+" "+o.items.map(i=>i[0]+" "+i[1]).join(" ")+" "+o.ship).toLowerCase().includes(t))}
 list.sort((a,b)=>view==="dispatched"?b.due.localeCompare(a.due):a.due.localeCompare(b.due)||a.n.localeCompare(b.n));
 const el=document.getElementById("list");
 const keep={};el.querySelectorAll("textarea[data-on]").forEach(a=>{if(a.value)keep[a.dataset.on]=a.value});const foc=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.on:null;
 if(!list.length){el.innerHTML=`<div class="empty">No orders here.</div>`;return}
 let html="";
 if(view==="pending"){
  const g=[["Overdue / due today",o=>dd(o)<=0],["Next 7 days",o=>dd(o)>0&&dd(o)<=7],["Later",o=>dd(o)>7]];
  g.forEach(([t,f])=>{const L=list.filter(f);if(L.length)html+=`<div class="group">${t} · ${L.length}<i></i></div><div class="grid">${L.map(card).join("")}</div>`});
 } else html=`<div class="group">Dispatched · ${list.length}<i></i></div><div class="grid">${list.map(card).join("")}</div>`;
 el.innerHTML=html;
 Object.entries(keep).forEach(([n,v])=>{const a=el.querySelector(`textarea[data-on="${n}"]`);if(a)a.value=v});if(foc){const a=el.querySelector(`textarea[data-on="${foc}"]`);if(a)a.focus()}
}

const API="https://script.google.com/macros/s/AKfycbyY7OjcmQyd5WM18XpWUBMchUg8WtLA_GTw30qS6YVIOTCvp-dK76lCEMy7ilipi5kzsw/exec", KEY="-jBFYlbrWT2DrFKb8jldXl7_";
let me="";try{me=localStorage.getItem("fyo_name")||""}catch(_){}
const nm=document.getElementById("myname");nm.value=me;nm.onchange=()=>{me=nm.value.trim();try{localStorage.setItem("fyo_name",me)}catch(_){}};
function banner(m){document.getElementById("banner").innerHTML=m?`<div class="banner">${m}</div>`:""}
function needName(){if(!me){banner("Pehle upar apna naam likhen, phir update karen.");nm.focus();return true}return false}
async function post(body){if(!API){banner("Saving abhi connect nahi hui (Google Sheet link pending).");throw 0}
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:KEY,by:me,...body})});
 const j=await r.json();if(!j.ok)throw j;}
let loading=false;
async function load(){if(!API||loading)return;loading=true;
 try{const r=await fetch(API+"?key="+encodeURIComponent(KEY)+"&t="+Date.now());const j=await r.json();
  if(j.error)throw j;state=j.stages||{};notes=j.notes||{};tnotes=j.team||[];render();renderTN();if(document.getElementById("banner").textContent.includes("connect"))banner("")}
 catch(e){banner("Saved stages load nahi ho sake — internet check karen.")}finally{loading=false}}
function renderTN(){const el=document.getElementById("tnl");
 if(!tnotes.length){el.innerHTML='<li><small>No notes yet.</small></li>';return}
 el.innerHTML=tnotes.map(n=>`<li><span>${esc(n.text)}</span><span><small>${new Date(n.at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}${n.by?` · ${esc(n.by)}`:""}</small> <button class="x" data-id="${esc(n.id)}" title="Delete">✕</button></span></li>`).join("")}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;view=b.dataset.v;filt=null;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render()};
document.getElementById("stats").onclick=e=>{const s=e.target.closest(".stat");if(!s)return;const f=s.dataset.f;
 if(f==="dis"){view="dispatched";filt=null}else{view="pending";filt=filt===f?null:f}
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.v===view));render()};
document.getElementById("q").oninput=e=>{q=e.target.value.trim();render()};
const busy={};
document.getElementById("list").addEventListener("click",async e=>{
 const b=e.target.closest(".st");if(b){if(needName())return;const n=b.dataset.n;let s=b.dataset.s;const o=ORDERS.find(x=>x.n===n);
  if(stageOf(o)===s)s="new";if(busy[n])return;busy[n]=1;const prev=state[n];state[n]={stage:s,at:Date.now(),by:me};render();
  try{await post({action:"stage",n,stage:s})}catch(_){state[n]=prev;render();banner(banner0())}finally{delete busy[n]}return}
 const sv=e.target.closest(".onsave");if(sv){if(needName())return;const n=sv.dataset.n;const ta=document.querySelector(`textarea[data-on="${n}"]`);const v=ta.value.trim();
  sv.disabled=true;try{await post({action:"note",n,text:v});notes[n]={text:v,by:me,at:Date.now()};ta.value="";render()}catch(_){banner(banner0())}finally{sv.disabled=false}}
});
function banner0(){return API?"Save nahi hua — dobara try karen.":"Saving abhi connect nahi hui (Google Sheet link pending)."}
document.getElementById("tnadd").onclick=async()=>{if(needName())return;const i=document.getElementById("tnin");const v=i.value.trim();if(!v)return;
 const b=document.getElementById("tnadd");b.disabled=true;try{await post({action:"team",text:v});i.value="";await load()}catch(_){banner(banner0())}finally{b.disabled=false}};
document.getElementById("tnl").onclick=async e=>{const x=e.target.closest(".x");if(!x)return;if(needName())return;try{await post({action:"teamdel",id:x.dataset.id});await load()}catch(_){banner(banner0())}};
render();renderTN();
if(!API)banner("Saving abhi connect nahi hui (Google Sheet link pending). Orders dekh sakte hain.");
load();setInterval(()=>{if(!document.hidden&&!document.activeElement.matches("textarea"))load()},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
